[package]
name = "type-history-build"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
readme.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/type-history-build"
license.workspace = true
publish = false
description = "Shared build authority and checked type history lifecycle operations"

[dependencies]
type-history-codegen = { path = "../type-history-codegen", version = "0.1.0" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml = "0.9.8"
tempfile = "3.23.0"
syn = { version = "2", features = ["full", "extra-traits"] }

[dev-dependencies]
type-history-core = { path = "../type-history-core", version = "0.1.0" }
