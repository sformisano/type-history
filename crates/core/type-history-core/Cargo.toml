[package]
name = "type-history-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Shared structural wire and runtime history contracts"
repository.workspace = true
readme.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/type-history-core"
license.workspace = true

[features]
default = []
typed-floats = ["dep:typed_floats"]
uuid = ["dep:uuid"]
rust-decimal = ["dep:rust_decimal"]
chrono = ["dep:chrono"]
time = ["dep:time"]
rc = ["serde/rc"]

[dependencies]
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
typed_floats = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
rust_decimal = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
time = { workspace = true, optional = true }
