[package]
name = "type-history-codegen"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
readme.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/type-history-codegen"
license.workspace = true
description = "Shared type history parsing, authority, and Rust generation"

[dependencies]
type-history-core = { path = "../type-history-core", version = "0.1.0" }
serde.workspace = true
serde_json = "1.0.149"
thiserror.workspace = true
syn = { version = "2", features = ["full", "extra-traits", "visit", "visit-mut"] }
quote = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }

[dev-dependencies]
tempfile = "3.23.0"
