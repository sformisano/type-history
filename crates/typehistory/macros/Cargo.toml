[package]
name = "typehistory-macros"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
proc-macro = true

[features]
default = []
redactable = ["typehistory-codegen/redactable", "typehistory-core/redactable"]

[dependencies]
typehistory-codegen = { path = "../codegen", version = "0.1.0" }
typehistory-core = { path = "../core", version = "0.1.0" }
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
proc-macro-crate = "3.5.0"
