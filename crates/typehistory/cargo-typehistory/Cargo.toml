[package]
name = "cargo-typehistory"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish = false
description = "Cargo subcommand for standalone type history lifecycle operations"

[[bin]]
name = "cargo-typehistory"
path = "src/main.rs"

[features]
default = []
redactable = ["typehistory-build/redactable"]

[dependencies]
typehistory-build = { path = "../build", version = "0.1.0" }
thiserror.workspace = true

[dev-dependencies]
tempfile = "3.23.0"
serde_json.workspace = true
toml = "0.9.8"
