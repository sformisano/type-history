[package]
name = "typehistory-build"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish = false
description = "Shared build authority and checked type history lifecycle operations"

[features]
default = []
redactable = ["typehistory-codegen/redactable"]

[dependencies]
typehistory-codegen = { path = "../typehistory-codegen", version = "0.1.0" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml = "0.9.8"
tempfile = "3.23.0"
syn = { version = "2", features = ["full", "extra-traits"] }

[dev-dependencies]
typehistory-core = { path = "../typehistory-core", version = "0.1.0" }
