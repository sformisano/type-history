[workspace]
members = [
    "crates/typehistory/core",
    "crates/typehistory/codegen",
    "crates/typehistory/macros",
    "crates/typehistory/typehistory",
    "crates/typehistory/build",
    "crates/typehistory/cargo-typehistory",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.97.0"
repository = "https://github.com/sformisano/typehistory"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { "version" = "1.0.228", "features" = ["derive"] }
serde_json = "1.0.149"
redactable = { version = "=0.12.0", default-features = false, features = ["redaction"] }
schemars = { "version" = "=1.2.2" }
thiserror = "2.0.18"
sha2 = "0.10.9"
