name: Agent skills

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate catalog
        env:
          TMPDIR: ${{ runner.temp }}
        run: bash .github/scripts/check-skillcatalog.sh

      - name: Check documentation links
        run: python3 .github/scripts/check-skill-links.py
